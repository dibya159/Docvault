<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>DocVault</title>
<style>
:root{--bg:#07080d;--surface:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--text:#eef1f8;--muted:#8d94a8;--accent:#38e1ff;--accent2:#8b5cff;--danger:#ff5c7a;--warn:#ffb84d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(500px 400px at 85% -5%,rgba(139,92,255,.28),transparent),radial-gradient(450px 380px at -10% 20%,rgba(56,225,255,.16),transparent),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--surface);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:16px;margin:22px 0 10px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:8px;cursor:pointer;overflow:hidden}
.thumb{aspect-ratio:4/3;border-radius:12px;background:#0d0f18 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-weight:700;transition:filter .2s}
body.blur .thumb{filter:blur(14px)}
.card b{display:block;margin:8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;margin:0 4px 4px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:rgba(255,184,77,.16);color:var(--warn)}
.badge.exp{background:rgba(255,92,122,.16);color:var(--danger)}
.banner{padding:12px 14px;margin-bottom:12px;border-color:rgba(255,184,77,.45)}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);outline:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select option{color:#000}
.btn{padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04060c;font-weight:700}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:44px 12px}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 20px));display:flex;justify-content:space-around;align-items:center;padding:8px;border-radius:24px;background:rgba(14,16,26,.8);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 8px;cursor:pointer}
#nav svg{width:22px;height:22px;fill:currentColor}
#nav button.on{color:var(--accent)}
#nav .fab{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04060c;border-radius:18px;padding:10px 16px;box-shadow:0 0 22px rgba(56,225,255,.35)}
.overlay{position:fixed;inset:0;background:rgba(3,4,8,.7);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.open{display:flex}
.sheet{width:min(560px,100%);max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#10121c;border:1px solid var(--border);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet label{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px}
.viewer img,.viewer iframe{width:100%;border-radius:14px;border:0;min-height:260px;background:#000}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lock .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 0 40px rgba(139,92,255,.5)}
#lock .logo svg{width:36px;fill:#04060c}
#lockForm{width:min(320px,100%);display:flex;flex-direction:column;gap:10px}
#lockMsg{color:var(--danger);min-height:20px;margin:0}
.hide{display:none!important}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1b1e2c;border:1px solid var(--border);padding:10px 16px;border-radius:12px;z-index:90;display:none}
</style>
</head>
<body>

<section id="lock">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg></div>
  <h1 data-app-name>DocVault</h1>
  <p class="sub" id="lockHint" data-tagline></p>
  <div id="lockForm"></div>
  <p id="lockMsg"></p>
</section>

<main id="app" class="hide">
  <div id="v-home"></div>
  <div id="v-search" class="hide" data-module="search">
    <h1>Search</h1>
    <input id="q" type="search" placeholder="Naam, category ya tag likhein" aria-label="Search">
    <div id="searchRes" class="grid" style="margin-top:14px"></div>
  </div>
  <div id="v-cats" class="hide"></div>
  <div id="v-settings" class="hide"></div>
</main>

<nav id="nav" class="hide"></nav>

<div class="overlay" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="overlay" id="viewWrap"><div class="sheet viewer" id="viewer"></div></div>
<div id="toast"></div>

<script>
/* ---------- DocVault core ---------- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder();
let CFG, KEY=null, docs=[], cats=[], view='home', filterCat=null, vault=false, lockTimer, urls=new Map(), prefs={blur:false,autolock:60};

/* IndexedDB */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('docvault',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});r.result.createObjectStore('meta')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const mget=k=>tx('meta','readonly',s=>s.get(k)), mset=(k,v)=>tx('meta','readwrite',s=>s.put(v,k));
const dall=()=>tx('docs','readonly',s=>s.getAll()), dput=d=>tx('docs','readwrite',s=>s.put(d)), ddel=id=>tx('docs','readwrite',s=>s.delete(id));

/* Crypto (AES-GCM, key PIN se PBKDF2 ke zariye) */
const derive=async(pin,salt)=>{const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])};
const encrypt=async buf=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,data:await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,buf)}};
const decrypt=(iv,data)=>crypto.subtle.decrypt({name:'AES-GCM',iv},KEY,data);

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2400)};

/* ---------- Login (username + password + privacy question) ---------- */
const DOM='@docvault.app',norm=s=>s.trim().toLowerCase();
const b2s=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const s2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ahash=async(salt,a)=>b2s(await crypto.subtle.digest('SHA-256',enc.encode(salt+'|'+a)));
const dclear=()=>tx('docs','readwrite',s=>s.clear());
let SESS={},tries=0;
const msg=t=>$('#lockMsg').textContent=t;
function lockUI(mode){
  const f=$('#lockForm'),h=$('#lockHint');msg('');
  if(mode==='login'){h.textContent=CFG.app.tagline;f.innerHTML=`<input id="uName" placeholder="Username" autocapitalize="none" autocomplete="username"><input id="uPass" type="password" placeholder="Password" autocomplete="current-password"><button class="btn primary" id="doLogin">Aage badhein</button><button class="btn" id="toSignup">Naya account banayein</button>`}
  if(mode==='signup'){h.textContent='Naya account';f.innerHTML=`<input id="uName" placeholder="Username (a-z, 0-9)" autocapitalize="none" autocomplete="username"><input id="uPass" type="password" placeholder="Password (6+ akshar)" autocomplete="new-password"><input id="uQ" list="qs" placeholder="Apna privacy question likhein"><datalist id="qs"><option value="Meri pehli school ka naam?"><option value="Meri maa ki birth city?"><option value="Mere bachpan ke dost ka naam?"></datalist><input id="uAns" placeholder="Uska jawab" autocomplete="off"><button class="btn primary" id="doSignup">Account banayein</button><button class="btn" id="toLogin">Wapas</button>`}
  if(mode==='answer'){h.textContent='Privacy question';f.innerHTML=`<p style="margin:0;font-size:17px"><b>${esc(SESS.profile.question)}</b></p><input id="uAns" placeholder="Aapka jawab" autocomplete="off"><button class="btn primary" id="doAns">Unlock</button><button class="btn" id="toLogin">Wapas</button>`}
}
async function showLock(){
  KEY=null;SESS={};vault=false;urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();docs=[];clearTimeout(lockTimer);
  $('#lock').classList.remove('hide');$('#app').classList.add('hide');$('#nav').classList.add('hide');
  closeSheets();lockUI('login');
  const p=await mget('profile');if(p&&$('#uName'))$('#uName').value=p.username;
}
async function doLogin(){
  const name=norm($('#uName').value),pass=$('#uPass').value;
  if(!name||!pass)return msg('Username aur password dalein.');
  msg('Check ho raha hai…');let profile;
  try{
    await fbLoad();
    const c=await FB.Au.signInWithEmailAndPassword(FB.auth,name+DOM,pass),uid=c.user.uid;
    profile=(await FB.D.get(FB.D.ref(FB.db,`users/${uid}/profile`))).val();
    if(!profile)return msg('Account setup adhura hai. Naya account banayein.');
    const loc=await mget('profile');if(!loc||loc.uid!==uid)await dclear();
    profile.uid=uid;await mset('profile',profile);
  }catch(e){
    const loc=await mget('profile'),off=!e.code||e.code==='auth/network-request-failed';
    if(off&&loc&&loc.username===name)profile=loc;
    else return msg(/PERMISSION/i.test(e.code||e.message)?'Database rules check karein.':off?'Internet chahiye.':'Username ya password galat.');
  }
  SESS={pass,profile};tries=0;lockUI('answer');
}
async function doSignup(){
  const name=norm($('#uName').value),pass=$('#uPass').value,q=$('#uQ').value.trim(),a=norm($('#uAns').value);
  if(!/^[a-z0-9_.]{3,20}$/.test(name))return msg('Username 3–20 akshar: a-z, 0-9, _ .');
  if(pass.length<6)return msg('Password kam se kam 6 akshar ka ho.');
  if(q.length<4||!a)return msg('Question aur jawab dono likhein.');
  msg('Account ban raha hai…');
  try{
    await fbLoad();
    const c=await FB.Au.createUserWithEmailAndPassword(FB.auth,name+DOM,pass),uid=c.user.uid;
    const salt=crypto.getRandomValues(new Uint8Array(16)),sb=b2s(salt);
    KEY=await derive(pass+'\u0000'+a,salt);const ck=await encrypt(enc.encode('docvault'));
    const profile={username:name,question:q,salt:sb,ansHash:await ahash(sb,a),check:{iv:b2s(ck.iv),data:b2s(ck.data)}};
    await FB.D.set(FB.D.ref(FB.db,`users/${uid}/profile`),profile);
    await dclear();await mset('profile',{...profile,uid});enter();
  }catch(e){KEY=null;msg(e.code==='auth/email-already-in-use'?'Ye username le liya gaya hai.':(!e.code||e.code==='auth/network-request-failed')?'Internet chahiye.':/PERMISSION/i.test(e.code)?'Database rules check karein.':e.code)}
}
async function doAns(){
  const a=norm($('#uAns').value),p=SESS.profile;if(!a)return;
  if(await ahash(p.salt,a)!==p.ansHash){if(++tries>=5){showLock();return msg('Bahut galat koshish. Dobara login karein.')}return msg(`Galat jawab. ${5-tries} koshish baaki.`)}
  try{
    const k=await derive(SESS.pass+'\u0000'+a,s2b(p.salt));
    await crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(p.check.iv)},k,s2b(p.check.data));
    KEY=k;SESS={};enter();
  }catch{showLock();msg('Password galat hai. Dobara login karein.')}
}
async function enter(){
  prefs=Object.assign(prefs,await mget('prefs')||{});
  cats=await mget('cats')||[...CFG.categories];
  document.body.classList.toggle('blur',!!prefs.blur);
  $('#lock').classList.add('hide');$('#app').classList.remove('hide');$('#nav').classList.remove('hide');
  await load();go('home');resetTimer();notifyExpiry();
  if(FB?.auth.currentUser)cloudSync().catch(()=>{});
}
function resetTimer(){clearTimeout(lockTimer);if(KEY)lockTimer=setTimeout(showLock,(prefs.autolock||CFG.settings.autoLockSeconds)*1000)}
['pointerdown','keydown','scroll'].forEach(e=>addEventListener(e,resetTimer,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&KEY&&prefs.lockOnHide)showLock()});

/* ---------- Data ---------- */
async function load(){docs=(await dall()).sort((a,b)=>b.created-a.created)}
const visible=()=>docs.filter(d=>!!d.hidden===vault);
async function thumbUrl(d){
  if(urls.has(d.id))return urls.get(d.id);
  if(!d.mime.startsWith('image/'))return null;
  try{const u=URL.createObjectURL(new Blob([await decrypt(d.iv,d.data)],{type:d.mime}));urls.set(d.id,u);return u}catch{return null}
}
const daysLeft=d=>d.expiry?Math.ceil((new Date(d.expiry)-new Date().setHours(0,0,0,0))/864e5):null;
function expBadge(d){
  if(!CFG.modules.expiry)return '';const n=daysLeft(d);if(n===null)return '';
  if(n<0)return '<span class="badge exp">Expired</span>';
  return n<=CFG.settings.expiryAlertDays?`<span class="badge">${n} din baaki</span>`:'';
}
function notifyExpiry(){
  if(!CFG.modules.expiry)return;
  const soon=docs.filter(d=>!d.hidden&&daysLeft(d)!==null&&daysLeft(d)<=CFG.settings.expiryAlertDays);
  if(soon.length&&'Notification' in window&&Notification.permission==='granted')
    new Notification('DocVault',{body:`${soon.length} document ki expiry paas hai.`,icon:'icon.svg'});
}

/* ---------- Views ---------- */
function go(v){
  view=v;if(v!=='settings')vault=false;
  $$('#app>div').forEach(e=>e.classList.add('hide'));$('#v-'+v).classList.remove('hide');
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));
  ({home:rHome,search:rSearch,cats:rCats,settings:rSettings})[v]();
}
async function cards(list){
  if(!list.length)return '<div class="empty" style="grid-column:1/-1">Koi document nahi mila.<br>+ Add se pehla document jodein.</div>';
  const th=await Promise.all(list.map(thumbUrl));
  return list.map((d,i)=>`<div class="card glass" data-id="${d.id}"><div class="thumb" style="${th[i]?`background-image:url(${th[i]})`:''}">${th[i]?'':(d.mime==='application/pdf'?'PDF':'FILE')}</div><b>${esc(d.name)}</b><small>${esc(d.cat)} ${expBadge(d)}</small></div>`).join('');
}
async function rHome(){
  const soon=CFG.modules.expiry?visible().filter(d=>daysLeft(d)!==null&&daysLeft(d)<=CFG.settings.expiryAlertDays):[];
  const list=visible().filter(d=>!filterCat||d.cat===filterCat);
  $('#v-home').innerHTML=`<h1>${esc(CFG.app.name)}</h1><p class="sub">${vault?'Hidden Vault':esc(CFG.app.tagline)}</p>
  ${soon.length?`<div class="banner glass"><b>Expiry alert</b><br>${soon.map(d=>`${esc(d.name)} — ${daysLeft(d)<0?'expired':daysLeft(d)+' din baaki'}`).join('<br>')}</div>`:''}
  <div class="chips"><button class="chip ${filterCat?'':'on'}" data-f="">Sab</button>${cats.map(c=>`<button class="chip ${filterCat===c?'on':''}" data-f="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <h2>${filterCat?esc(filterCat):'Recent documents'}</h2><div class="grid">${await cards(list)}</div>`;
}
async function rSearch(){
  const q=$('#q').value.trim().toLowerCase();
  const list=q?visible().filter(d=>[d.name,d.cat,d.tags].join(' ').toLowerCase().includes(q)):[];
  $('#searchRes').innerHTML=q?await cards(list):'<div class="empty" style="grid-column:1/-1">Likhna shuru karein…</div>';
}
function rCats(){
  $('#v-cats').innerHTML=`<h1>Categories</h1><p class="sub">Tap karke us category ke documents dekhein.</p>
  ${cats.map(c=>`<div class="row glass" data-cat="${esc(c)}" style="cursor:pointer"><b>${esc(c)}</b><span class="sub" style="margin:0">${visible().filter(d=>d.cat===c).length}</span></div>`).join('')}
  <div style="display:flex;gap:10px;margin-top:14px"><input id="newCat" placeholder="Nayi category" maxlength="24"><button class="btn primary" id="addCat">Jodein</button></div>`;
}
function rSettings(){
  $('#v-settings').innerHTML=`<h1>Security</h1><p class="sub">Documents device par encrypt hote hain.</p>
  <div class="row glass"><span>Auto-lock</span><select id="autolock" style="width:auto">${[30,60,300].map(s=>`<option value="${s}" ${prefs.autolock==s?'selected':''}>${s<60?s+' sec':s/60+' min'}</option>`).join('')}</select></div>
  <div class="row glass" data-module="blur"><span>Thumbnail blur</span><button class="btn" id="blurT">${prefs.blur?'On':'Off'}</button></div>
  <div class="row glass"><span>Background me jate hi lock</span><button class="btn" id="hideT">${prefs.lockOnHide?'On':'Off'}</button></div>
  <div class="row glass" data-module="expiry"><span>Expiry notifications</span><button class="btn" id="notifT">Allow</button></div>
  <div class="row glass"><span>Cloud sync</span><button class="btn" id="cloudT">Abhi sync</button></div>
  <div class="row glass" data-module="hiddenVault"><span>Hidden Vault</span><button class="btn" id="vaultT">Kholein</button></div>
  <div style="display:flex;gap:10px"><button class="btn" id="lockNow" style="flex:1">Lock karein</button><button class="btn danger" id="logoutT" style="flex:1">Logout</button></div>`;
  Object.entries(CFG.modules).forEach(([k,on])=>{if(!on)$$(`#v-settings [data-module="${k}"]`).forEach(e=>e.remove())});
}

/* ---------- Add / Edit sheet ---------- */
function closeSheets(){$('#sheetWrap').classList.remove('open');$('#viewWrap').classList.remove('open')}
function openSheet(d){
  $('#sheet').innerHTML=`<h1>${d?'Document edit':'Naya document'}</h1>
  <label>${d?'File badalni ho to chunein (optional)':'Photo ya file'}</label>
  <input type="file" id="file" accept="image/*,application/pdf">
  <label>Naam</label><input id="dName" maxlength="60" value="${esc(d?.name)}" placeholder="Jaise: Aadhaar Card">
  <label>Category</label><select id="dCat">${cats.map(c=>`<option ${d?.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <label>Tags (comma se alag)</label><input id="dTags" value="${esc(d?.tags)}" placeholder="id, govt">
  <div data-module="expiry"><label>Expiry date (optional)</label><input type="date" id="dExp" value="${esc(d?.expiry)}"></div>
  <div class="row" data-module="hiddenVault" style="padding:14px 0 4px"><span>Hidden Vault me rakhein</span><input type="checkbox" id="dHid" style="width:auto" ${d?.hidden?'checked':''}></div>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save" style="flex:1">Save</button></div>`;
  Object.entries(CFG.modules).forEach(([k,on])=>{if(!on)$$(`#sheet [data-module="${k}"]`).forEach(e=>e.remove())});
  $('#sheetWrap').classList.add('open');
  $('#cancel').onclick=closeSheets;
  $('#save').onclick=()=>saveDoc(d);
}
async function saveDoc(old){
  const f=$('#file').files[0],name=$('#dName').value.trim();
  if(!old&&!f)return toast('Pehle file chunein.');
  if(!name)return toast('Naam likhein.');
  if(f&&f.size>CFG.settings.maxFileMB*1048576)return toast(`File ${CFG.settings.maxFileMB} MB se chhoti rakhein.`);
  const d=old?{...old}:{id:crypto.randomUUID(),created:Date.now()};
  Object.assign(d,{name,cat:$('#dCat').value,tags:$('#dTags').value.trim(),expiry:$('#dExp')?.value||'',hidden:!!$('#dHid')?.checked,updated:Date.now()});
  if(f){
    const e=await encrypt(await f.arrayBuffer());
    Object.assign(d,{mime:f.type||'application/octet-stream',iv:e.iv,data:e.data});
    if(urls.has(d.id)){URL.revokeObjectURL(urls.get(d.id));urls.delete(d.id)}
  }
  await dput(d);await load();closeSheets();toast('Saved — upload ho raha hai…');cloudPush(d);go(view==='add'?'home':view);
}

/* ---------- Viewer ---------- */
async function openDoc(id){
  const d=docs.find(x=>x.id===id);if(!d)return;
  const u=URL.createObjectURL(new Blob([await decrypt(d.iv,d.data)],{type:d.mime}));
  $('#viewer').innerHTML=`<h1>${esc(d.name)}</h1><p class="sub">${esc(d.cat)} ${expBadge(d)}${d.expiry?' · '+esc(d.expiry):''}</p>
  ${d.mime.startsWith('image/')?`<img src="${u}" alt="${esc(d.name)}">`:`<iframe src="${u}" title="${esc(d.name)}"></iframe>`}
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn danger" id="vDel">Delete</button><button class="btn" id="vEdit">Edit</button><button class="btn primary" id="vClose" style="flex:1">Close</button></div>`;
  $('#viewWrap').classList.add('open');
  const done=()=>{URL.revokeObjectURL(u);closeSheets()};
  $('#vClose').onclick=done;
  $('#vEdit').onclick=()=>{done();openSheet(d)};
  $('#vDel').onclick=async()=>{if(!confirm('Yeh document delete karein?'))return;await ddel(d.id);cloudDel(d.id);if(urls.has(d.id)){URL.revokeObjectURL(urls.get(d.id));urls.delete(d.id)}await load();done();go(view)};
}

/* ---------- Cloud sync (Firebase Realtime DB, original quality, encrypted) ---------- */
let FB=null;
async function fbLoad(){
  if(FB)return FB;
  const base='https://www.gstatic.com/firebasejs/10.14.1/';
  const [A,Au,D]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
  const app=A.initializeApp(CFG.firebase.config);
  return FB={Au,D,auth:Au.getAuth(app),db:D.getDatabase(app)};
}
const CH=3000000;
const uref=p=>FB.D.ref(FB.db,`users/${FB.auth.currentUser.uid}/${p}`);
async function cloudPush(d){
  try{
    if(!FB?.auth.currentUser)return;
    const s=b2s(d.data),n=Math.ceil(s.length/CH);
    await FB.D.remove(uref('files/'+d.id));
    for(let i=0;i<n;i++)await FB.D.set(uref(`files/${d.id}/${i}`),s.slice(i*CH,(i+1)*CH));
    await FB.D.set(uref('docs/'+d.id),{id:d.id,name:d.name,cat:d.cat,tags:d.tags||'',expiry:d.expiry||'',hidden:!!d.hidden,created:d.created,updated:d.updated||d.created,mime:d.mime,iv:b2s(d.iv),n});
    toast('Upload ho gaya: '+d.name);
  }catch{toast('Cloud upload fail. Internet ya rules check karein')}
}
async function cloudDel(id){
  try{if(FB?.auth.currentUser){await FB.D.remove(uref('files/'+id));await FB.D.set(uref('docs/'+id),{deleted:true,updated:Date.now()})}}catch{}
}
async function cloudSync(){
  if(!FB?.auth.currentUser)return toast('Online login chahiye');
  toast('Sync ho raha hai…');
  const remote=(await FB.D.get(uref('docs'))).val()||{};
  for(const [id,r] of Object.entries(remote)){
    const l=docs.find(x=>x.id===id);
    if(l&&(l.updated||l.created)>=r.updated)continue;
    if(r.deleted){if(l)await ddel(id);continue}
    let s='';for(let i=0;i<r.n;i++)s+=(await FB.D.get(uref(`files/${id}/${i}`))).val()||'';
    await dput({...r,iv:s2b(r.iv),data:s2b(s).buffer});
  }
  await load();
  for(const d of docs){const r=remote[d.id];if(!r||r.updated<(d.updated||d.created))await cloudPush(d)}
  go(view);toast('Sync ho gaya');
}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;let el;
  if(t.closest('#doLogin'))return doLogin();
  if(t.closest('#toSignup'))return lockUI('signup');
  if(t.closest('#doSignup'))return doSignup();
  if(t.closest('#toLogin'))return showLock();
  if(t.closest('#doAns'))return doAns();
  if(el=t.closest('[data-nav]')){return el.dataset.nav==='add'?openSheet():(filterCat=null,go(el.dataset.nav))}
  if(el=t.closest('.card'))return openDoc(el.dataset.id);
  if(el=t.closest('[data-f]')){filterCat=el.dataset.f||null;return rHome()}
  if(el=t.closest('[data-cat]')){filterCat=el.dataset.cat;return go('home')}
  if(t.closest('#addCat')){const v=$('#newCat').value.trim();if(v&&!cats.includes(v)){cats.push(v);await mset('cats',cats);rCats()}return}
  if(t.closest('#blurT')){prefs.blur=!prefs.blur;document.body.classList.toggle('blur',prefs.blur);await mset('prefs',prefs);return rSettings()}
  if(t.closest('#hideT')){prefs.lockOnHide=!prefs.lockOnHide;await mset('prefs',prefs);return rSettings()}
  if(t.closest('#notifT')){const p=await Notification.requestPermission();return toast(p==='granted'?'Alerts on':'Permission nahi mili')}
  if(t.closest('#cloudT')){try{await cloudSync()}catch{toast('Sync fail. Internet check karein')}return}
  if(t.closest('#lockNow'))return showLock();
  if(t.closest('#logoutT')){try{await FB?.Au.signOut(FB.auth)}catch{}return showLock()}
  if(t.closest('#vaultT')){
    const a=prompt('Hidden Vault ke liye apne privacy question ka jawab dalein');if(!a)return;
    const p=await mget('profile');
    if(await ahash(p.salt,norm(a))===p.ansHash){vault=true;filterCat=null;go('home');toast('Hidden Vault khula')}else toast('Galat jawab');
    return;
  }
  if(t.classList.contains('overlay'))closeSheets();
});
document.addEventListener('input',async e=>{
  if(e.target.id==='q')rSearch();
  if(e.target.id==='autolock'){prefs.autolock=+e.target.value;await mset('prefs',prefs);resetTimer()}
});
$('#lock').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lockForm .primary')?.click()});
